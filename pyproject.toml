[project]
name = "mc-bot"
version = "0.1.0"
description = "Forward Minecraft server activity to Discord."
requires-python = ">=3.14,<3.15"
dependencies = [
    "discord.py==2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[project.scripts]
mc-bot = "mc_bot.main:run"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mc_bot = ["resources/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]

