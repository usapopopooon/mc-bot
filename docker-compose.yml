services:
  mc-bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: "${DISCORD_TOKEN:?Set the Discord bot token}"
      MINECRAFT_DATA_VOLUME: "${MINECRAFT_DATA_VOLUME:?Set the Minecraft Docker volume name}"
      MINECRAFT_RCON_HOST: minecraft
      MINECRAFT_RCON_PORT: "25575"
      MINECRAFT_RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD:?Set the Minecraft RCON password}"
      FLOODGATE_USERNAME_PREFIX: "${FLOODGATE_USERNAME_PREFIX:-.}"
      VOICEVOX_TTS_API_URL: "${VOICEVOX_TTS_API_URL:-}"
      VOICEVOX_TTS_API_TOKEN: "${VOICEVOX_TTS_API_TOKEN:-}"
      VOICEVOX_SPEAKER_ID: "${VOICEVOX_SPEAKER_ID:-46}"
      VOICEVOX_SPEED: "${VOICEVOX_SPEED:-1.0}"
      LEVEL_BOT_API_URL: "${LEVEL_BOT_API_URL:-}"
      LEVEL_BOT_API_TOKEN: "${LEVEL_BOT_API_TOKEN:-}"
      MINECRAFT_XP_POLL_SECONDS: "${MINECRAFT_XP_POLL_SECONDS:-30}"
    volumes:
      - minecraft-data:/minecraft
      - mc-bot-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    networks:
      - default
      - minecraft-control

volumes:
  minecraft-data:
    external: true
    name: "${MINECRAFT_DATA_VOLUME:?Set the Minecraft Docker volume name}"
  mc-bot-data:

networks:
  minecraft-control:
    external: true
    name: "${MINECRAFT_CONTROL_NETWORK:-minecraft-control}"
