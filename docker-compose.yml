services:
  mc-bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: "${DISCORD_TOKEN:?Set the Discord bot token}"
      MINECRAFT_DATA_VOLUME: "${MINECRAFT_DATA_VOLUME:?Set the Minecraft Docker volume name}"
    volumes:
      - minecraft-data:/minecraft:ro
      - mc-bot-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  minecraft-data:
    external: true
    name: "${MINECRAFT_DATA_VOLUME:?Set the Minecraft Docker volume name}"
  mc-bot-data:
