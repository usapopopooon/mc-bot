services:
  mc-bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: "${DISCORD_TOKEN:?Set the Discord bot token}"
      MINECRAFT_DATA_VOLUME: "${MINECRAFT_DATA_VOLUME:?Set the Minecraft Docker volume name}"
    volumes:
      - type: bind
        source: "/var/lib/docker/volumes/${MINECRAFT_DATA_VOLUME:?Set the Minecraft Docker volume name}/_data"
        target: /minecraft
        read_only: true
      - mc-bot-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  mc-bot-data:
